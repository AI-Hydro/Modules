name: Checks

# Pull-request gate. Everything here also runs locally, with the same commands (see CONTRIBUTING.md).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: python -m pip install pytest numpy matplotlib pillow

      - name: Modules are built (shared code, data, manifests and static outputs inlined)
        run: python scripts/build_modules.py --check

      - name: Static cell outputs match the cell sources
        run: python scripts/render_static_outputs.py --check

      - name: README module table and course page are generated from the manifests
        run: python scripts/gen_docs.py --check

      - name: Manifests, embedded manifests and course.json are valid and agree
        run: python scripts/validate_manifests.py

      - name: CSP and external-host check (only the Google Fonts hosts are allowed)
        run: python scripts/check_csp.py

      - name: API files are current
        run: python scripts/build_api.py --check

      - name: Python tests
        run: python -m pytest tests -q

      - name: Node tests
        run: node --test tests/js/*.test.js
