name: Build Modules API

# Regenerates api/modules.json and api/courses.json with scripts/build_api.py (the same code a local
# run uses). Triggered by anything that can change what the API says: module sources and manifests,
# course definitions and the shared code that is inlined into modules. The daily run only refreshes
# GitHub reaction counts.
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'courses/**'
      - 'shared/**'
  schedule:
    # Refresh reaction counts daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # updatedAt comes from the last git commit touching each module

      - name: Build api/modules.json and api/courses.json
        run: python3 scripts/build_api.py

      - name: Scrape GitHub Discussion reactions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, os

          api_path = "api/modules.json"
          if not os.path.exists(api_path):
              print("No api/modules.json found, skipping reaction scrape")
              exit(0)

          with open(api_path) as f:
              items = json.load(f)

          repo = "AI-Hydro/Modules"
          updated = False

          for item in items:
              module_id = item["moduleId"]
              title = item.get("title", module_id)

              search_result = subprocess.run(
                  ["gh", "api", f"repos/{repo}/discussions",
                   "--jq", f'[.[] | select(.title == "Module: {title}")] | first'],
                  capture_output=True, text=True
              )
              discussion = None
              if search_result.returncode == 0 and search_result.stdout.strip() not in ("", "null"):
                  try:
                      discussion = json.loads(search_result.stdout.strip())
                  except Exception:
                      pass

              if discussion:
                  reactions_result = subprocess.run(
                      ["gh", "api", f"repos/{repo}/discussions/{discussion['number']}/reactions",
                       "--jq", "length"],
                      capture_output=True, text=True
                  )
                  if reactions_result.returncode == 0:
                      try:
                          count = int(reactions_result.stdout.strip())
                          if item.get("githubReactions") != count:
                              item["githubReactions"] = count
                              updated = True
                      except ValueError:
                          pass
                  new_url = discussion.get("html_url", "")
                  if new_url and item.get("discussionUrl") != new_url:
                      item["discussionUrl"] = new_url
                      updated = True

          if updated:
              with open(api_path, "w") as f:
                  json.dump(items, f, indent=2)
                  f.write("\n")
              print("Updated reaction counts in api/modules.json")
          else:
              print("No reaction count changes")
          EOF

      - name: Commit updated API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/modules.json api/courses.json
          if git diff --staged --quiet; then
            echo "No changes to the API files"
          else
            git commit -m "ci: rebuild api/modules.json and api/courses.json [skip ci]"
            git push
          fi
